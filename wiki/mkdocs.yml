site_name: DeepSeek Harness 中文 Wiki
site_description: DeepSeek Harness 中文 Wiki —— 使用指南、开发文档、插件生态与竞品对比
site_url: http://127.0.0.1:8000

repo_url: https://github.com/deepseek-ai/deepseek-harness
repo_name: deepseek-ai/deepseek-harness

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - attr_list
  - md_in_html
  - def_list
  - footnotes

plugins:
  - search

nav:
  - 首页: index.md
  - 使用指南:
      - 概览: usage/index.md
      - 安装: usage/installation.md
      - Web UI: usage/web-ui.md
